<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CaissePro — Hors ligne</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,.08);
      max-width: 460px;
      width: 100%;
      padding: 40px 36px;
      text-align: center;
    }

    .logo {
      width: 72px;
      height: 72px;
      background: #16a34a;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 900;
      color: #fff;
      margin: 0 auto 24px;
      box-shadow: 0 8px 24px rgba(22,163,74,.25);
    }

    .icon-wrap {
      width: 64px;
      height: 64px;
      background: #fef2f2;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }

    .icon-wrap svg { color: #ef4444; }

    h1 {
      font-size: 22px;
      font-weight: 900;
      color: #0f172a;
      margin-bottom: 10px;
    }

    p {
      font-size: 14px;
      font-weight: 600;
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .pages {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 28px;
      text-align: left;
    }

    .pages-title {
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: #94a3b8;
      margin-bottom: 12px;
    }

    .pages a {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 12px;
      text-decoration: none;
      color: #0f172a;
      font-size: 13px;
      font-weight: 700;
      transition: background .15s;
    }

    .pages a:hover { background: #e2e8f0; }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #16a34a;
      flex-shrink: 0;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #16a34a;
      color: #fff;
      font-size: 14px;
      font-weight: 900;
      padding: 14px 28px;
      border-radius: 16px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(22,163,74,.25);
      transition: background .15s, transform .1s;
      width: 100%;
      justify-content: center;
    }

    .btn:hover { background: #15803d; }
    .btn:active { transform: scale(.98); }

    .status {
      margin-top: 20px;
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
    }

    .status span { color: #ef4444; font-weight: 900; }
    .status.online span { color: #16a34a; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">C</div>

    <div class="icon-wrap">
      <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.56 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>

    <h1>Vous êtes hors ligne</h1>
    <p>
      Les fonctionnalités de base restent disponibles.<br>
      Vos ventes seront synchronisées automatiquement à la reconnexion.
    </p>

    <div class="pages">
      <p class="pages-title">Pages disponibles hors ligne</p>
      <a href="/dashboard"><span class="dot"></span>Tableau de bord</a>
      <a href="/pos"><span class="dot"></span>Caisse (POS)</a>
      <a href="/products"><span class="dot"></span>Produits</a>
      <a href="/sales"><span class="dot"></span>Ventes</a>
      <a href="/customers"><span class="dot"></span>Clients</a>
    </div>

    <button class="btn" onclick="location.reload()">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"></polyline>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
      </svg>
      Réessayer
    </button>

    <p class="status" id="status">
      Statut : <span>Hors ligne</span>
    </p>
  </div>

  <script>
    function updateStatus() {
      const el = document.getElementById('status')
      if (navigator.onLine) {
        el.className = 'status online'
        el.innerHTML = 'Statut : <span>En ligne — rechargement...</span>'
        setTimeout(() => location.reload(), 800)
      } else {
        el.className = 'status'
        el.innerHTML = 'Statut : <span>Hors ligne</span>'
      }
    }
    window.addEventListener('online', updateStatus)
    window.addEventListener('offline', updateStatus)
    updateStatus()
  </script>
</body>
</html>
